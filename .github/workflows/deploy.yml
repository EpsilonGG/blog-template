name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：只允许读取仓库、写入 Pages、使用 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 站点把站内链接全部写成根绝对路径（`/blog/`、`/images/x.jpg`），只有仓库名是
    # `<用户名>.github.io` 时才部署在域名根路径上。模板仓库本身叫 blog-template，
    # 不满足这个条件，所以直接跳过——否则每次 push 都会留一条失败的 run，
    # 让人误以为模板坏了。改名成 `<用户名>.github.io` 之后这条守卫自动放行。
    if: ${{ endsWith(github.repository, '.github.io') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：供未来可能使用 Git 历史的脚本或内容使用
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 必须是 22.23.4 以上：astro 7.4 起 engines 有这个下限
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Markdown plugin tests
        run: npm run test:md

      - name: Build site
        run: npm run build

      # 死链检查对着产物跑：页面改名之后忘了改链接，构建不会报错，
      # 只有点进去的人看到 404。只查站内（本地文件比对），不联网，不会因为
      # 外站限流或超时让流水线莫名变红。
      - name: Check internal links
        run: npm run links

      # 放在构建之后：图片清单和 WebP 变体是构建时生成的，测试要对着产物验
      - name: Script tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
